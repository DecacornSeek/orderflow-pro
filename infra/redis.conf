# OrderFlow Pro — Redis Config
# Minimal production config for local dev + VPS

# Persistence: RDB snapshot every 60s if at least 1 key changed
save 60 1

# Max memory: 256MB, evict least-recently-used keys when full
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""

# Logging
loglevel notice
logfile ""

# Bind to all interfaces (Docker: restricted via network)
bind 0.0.0.0

# Default port
port 6379

# Max clients
maxclients 100

# Pub/Sub: no limit on message backlog
client-output-buffer-limit pubsub 32mb 8mb 60
