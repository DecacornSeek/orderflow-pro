[project]
name = "orderflow-pro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt[pro]",
    "openai",
    "fastapi",
    "uvicorn[standard]",
    "rich",
    "pandas",
    "pyarrow",
    "requests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
